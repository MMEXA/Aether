<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 586">
  <defs>
    <!-- 绚丽边缘的高级能量泛光 -->
    <filter id="energy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 微型内发光，制造类似阳极氧化铝或者磨砂金属的浅色质感 (Light Mode only) -->
    <filter id="matte-aluminum" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-1" stdDeviation="0.5" flood-color="#ffffff" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#a1a1aa" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    /* Default is LIGHT MODE palette to ensure visibility on light backgrounds */
    :root {
      --frame-fill: #a1a1aa; /* Zinc 400 */
      --stripe-fill: #52525b; /* Zinc 600 */
      --text-fill: #27272a; /* Zinc 800 */
      --trace-glow: #1a1a1a;
      --blur-filter: url(#matte-aluminum);
    }

    /* Override with DARK MODE palette if OS or container dictates it */
    @media (prefers-color-scheme: dark) {
      :root {
        --frame-fill: #ffffff;
        --stripe-fill: #ffffff;
        --text-fill: #ffffff;
        --trace-glow: #ffffff;
        --blur-filter: blur(0px); /* Or custom dark drop shadow */
      }
    }

    /* 绚丽流转描边 (能量刻线) */
    .stroke-path {
      fill: none;
      stroke: var(--trace-glow);
      stroke-width: 2.5px;
      stroke-linecap: square;
      stroke-linejoin: miter;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      filter: url(#energy-glow);
      animation: drawFlow 2.8s cubic-bezier(0.2, 0.0, 0.2, 1) forwards;
    }

    /* 沉稳渐变显形的实体 (物质凝固) */
    .fill-path {
      opacity: 0;
      filter: blur(6px);
      animation: settleFill 2.4s cubic-bezier(0.3, 0.0, 0.1, 1) forwards;
    }

    .fill-frame { fill: var(--frame-fill); }
    .fill-stripe { fill: var(--stripe-fill); }
    .fill-text { fill: var(--text-fill); }

    /* Keyframe: 描边的流转与消散 */
    @keyframes drawFlow {
      0% {
        stroke-dashoffset: 100;
        stroke-width: 1px;
        opacity: 0;
      }
      10% {
        opacity: 1;
        stroke-width: 3px;
      }
      70% {
        stroke-dashoffset: 0;
        stroke-width: 3px;
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        stroke-width: 0px;
        opacity: 0;
      }
    }

    /* Keyframe: 实体的凝固与定型 */
    @keyframes settleFill {
      0% {
        opacity: 0;
        filter: blur(6px);
      }
      40% {
        opacity: 0.6;
        filter: blur(2px);
      }
      100% {
        opacity: 1;
        filter: var(--blur-filter);
      }
    }
  </style>

  <!-- Phase 2: 渐变显形的实体 (Fill Layer) -->
  <g class="fills">
    <!-- Frame -->
    <path class="fill-path fill-frame" style="animation-delay: 1.2s;" d="M 261,4 L 81,4 L 4,81 L 4,277 L 44,277 L 44,101 L 101,44 L 261,44 Z" />
    <path class="fill-path fill-frame" style="animation-delay: 1.3s;" d="M 4,309 L 4,505 L 81,582 L 261,582 L 261,542 L 101,542 L 44,485 L 44,309 Z" />
    <path class="fill-path fill-frame" style="animation-delay: 1.4s;" d="M 293,4 L 473,4 L 550,81 L 550,277 L 510,277 L 510,101 L 453,44 L 293,44 Z" />
    <path class="fill-path fill-frame" style="animation-delay: 1.5s;" d="M 550,309 L 550,505 L 473,582 L 293,582 L 293,542 L 453,542 L 510,485 L 510,309 Z" />

    <!-- Stripes -->
    <path class="fill-path fill-stripe" style="animation-delay: 1.6s;" d="M 144,264 L 144,296 L 220,372 L 144,372 L 144,396 L 276,396 Z" />
    <path class="fill-path fill-stripe" style="animation-delay: 1.7s;" d="M 144,188 L 144,220 L 320,396 L 352,396 Z" />
    <path class="fill-path fill-stripe" style="animation-delay: 1.8s;" d="M 144,128 L 160,128 L 412,380 L 412,396 L 396,396 L 144,144 Z" />
    <path class="fill-path fill-stripe" style="animation-delay: 1.9s;" d="M 204,128 L 236,128 L 412,304 L 412,336 Z" />
    <path class="fill-path fill-stripe" style="animation-delay: 2.0s;" d="M 280,128 L 412,128 L 412,152 L 336,152 L 412,228 L 412,260 Z" />

    <!-- Text -->
    <path class="fill-path fill-text" style="animation-delay: 2.2s;" d="M 148.5,420 L 148.5,458 L 154.5,464 L 184.5,464 L 190.5,458 L 190.5,420 L 178.5,420 L 178.5,450 L 176.5,452 L 162.5,452 L 160.5,450 L 160.5,420 Z" />
    <path class="fill-path fill-text" style="animation-delay: 2.3s;" d="M 204.5,420 L 204.5,464 L 216.5,464 L 216.5,440 L 237.5,464 L 249.5,464 L 249.5,420 L 237.5,420 L 237.5,444 L 216.5,420 Z" />
    <path class="fill-path fill-text" style="animation-delay: 2.4s;" d="M 267.5,420 L 261.5,426 L 261.5,458 L 267.5,464 L 297.5,464 L 303.5,458 L 303.5,440 L 283.5,440 L 283.5,448 L 291.5,448 L 291.5,450 L 289.5,452 L 275.5,452 L 273.5,450 L 273.5,434 L 275.5,432 L 289.5,432 L 291.5,434 L 291.5,436 L 303.5,436 L 303.5,426 L 297.5,420 Z" />
    <path class="fill-path fill-text" style="animation-delay: 2.5s;" d="M 317.5,420 L 317.5,464 L 351.5,464 L 351.5,452 L 329.5,452 L 329.5,420 Z" />
    <path class="fill-path fill-text" style="animation-delay: 2.6s;" d="M 369.5,420 L 363.5,426 L 363.5,458 L 369.5,464 L 399.5,464 L 405.5,458 L 405.5,448 L 393.5,448 L 393.5,450 L 391.5,452 L 377.5,452 L 375.5,450 L 375.5,434 L 377.5,432 L 391.5,432 L 393.5,434 L 393.5,436 L 405.5,436 L 405.5,426 L 399.5,420 Z" />
  </g>

  <!-- Phase 1: 绚丽边缘的高光流转 (Stroke Layer) -->
  <g class="strokes">
    <path class="stroke-path" style="animation-delay: 0.0s;" pathLength="100" d="M 261,4 L 81,4 L 4,81 L 4,277 L 44,277 L 44,101 L 101,44 L 261,44 Z" />
    <path class="stroke-path" style="animation-delay: 0.1s;" pathLength="100" d="M 4,309 L 4,505 L 81,582 L 261,582 L 261,542 L 101,542 L 44,485 L 44,309 Z" />
    <path class="stroke-path" style="animation-delay: 0.2s;" pathLength="100" d="M 293,4 L 473,4 L 550,81 L 550,277 L 510,277 L 510,101 L 453,44 L 293,44 Z" />
    <path class="stroke-path" style="animation-delay: 0.3s;" pathLength="100" d="M 550,309 L 550,505 L 473,582 L 293,582 L 293,542 L 453,542 L 510,485 L 510,309 Z" />

    <path class="stroke-path" style="animation-delay: 0.4s;" pathLength="100" d="M 144,264 L 144,296 L 220,372 L 144,372 L 144,396 L 276,396 Z" />
    <path class="stroke-path" style="animation-delay: 0.5s;" pathLength="100" d="M 144,188 L 144,220 L 320,396 L 352,396 Z" />
    <path class="stroke-path" style="animation-delay: 0.6s;" pathLength="100" d="M 144,128 L 160,128 L 412,380 L 412,396 L 396,396 L 144,144 Z" />
    <path class="stroke-path" style="animation-delay: 0.7s;" pathLength="100" d="M 204,128 L 236,128 L 412,304 L 412,336 Z" />
    <path class="stroke-path" style="animation-delay: 0.8s;" pathLength="100" d="M 280,128 L 412,128 L 412,152 L 336,152 L 412,228 L 412,260 Z" />

    <path class="stroke-path" style="animation-delay: 1.0s;" pathLength="100" d="M 148.5,420 L 148.5,458 L 154.5,464 L 184.5,464 L 190.5,458 L 190.5,420 L 178.5,420 L 178.5,450 L 176.5,452 L 162.5,452 L 160.5,450 L 160.5,420 Z" />
    <path class="stroke-path" style="animation-delay: 1.1s;" pathLength="100" d="M 204.5,420 L 204.5,464 L 216.5,464 L 216.5,440 L 237.5,464 L 249.5,464 L 249.5,420 L 237.5,420 L 237.5,444 L 216.5,420 Z" />
    <path class="stroke-path" style="animation-delay: 1.2s;" pathLength="100" d="M 267.5,420 L 261.5,426 L 261.5,458 L 267.5,464 L 297.5,464 L 303.5,458 L 303.5,440 L 283.5,440 L 283.5,448 L 291.5,448 L 291.5,450 L 289.5,452 L 275.5,452 L 273.5,450 L 273.5,434 L 275.5,432 L 289.5,432 L 291.5,434 L 291.5,436 L 303.5,436 L 303.5,426 L 297.5,420 Z" />
    <path class="stroke-path" style="animation-delay: 1.3s;" pathLength="100" d="M 317.5,420 L 317.5,464 L 351.5,464 L 351.5,452 L 329.5,452 L 329.5,420 Z" />
    <path class="stroke-path" style="animation-delay: 1.4s;" pathLength="100" d="M 369.5,420 L 363.5,426 L 363.5,458 L 369.5,464 L 399.5,464 L 405.5,458 L 405.5,448 L 393.5,448 L 393.5,450 L 391.5,452 L 377.5,452 L 375.5,450 L 375.5,434 L 377.5,432 L 391.5,432 L 393.5,434 L 393.5,436 L 405.5,436 L 405.5,426 L 399.5,420 Z" />
  </g>
</svg>

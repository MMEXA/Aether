<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 586" style="background: transparent;">
  <style>
    :root {
      color-scheme: light dark;
      /* LIGHT MODE */
      --frame-fill: #d4d4d8;
      --stripe-fill: #71717a;
      --text-fill: #27272a;
      --trace-color: #a1a1aa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* DARK MODE */
        --frame-fill: #ffffff;
        --stripe-fill: #ffffff;
        --text-fill: #ffffff;
        --trace-color: #ffffff;
      }
    }

    .path-frame { fill: var(--frame-fill); }
    .path-stripe { fill: var(--stripe-fill); }
    .path-text { fill: var(--text-fill); }
    /* 静态 Logo：绝对素雅标准照，没有任何阴影和高光滤镜 */
    .cyan-accent {
      fill: #00f0ff;
    }
  </style>
